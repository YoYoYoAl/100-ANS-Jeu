name: Transcrire la chanson (horodatage des citations)
on:
  push:
    branches: [transcription]
    paths: [audio/chanson/*.mp3, generation/transcrire.py, .github/workflows/transcrire-chanson.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install "faster-whisper==1.1.1" requests
      - name: Transcription
        run: python generation/transcrire.py > audio/chanson/journal.txt 2>&1 || true
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898287+github-actions[bot]@users.noreply.github.com"
          git add audio/chanson/journal.txt audio/chanson/mots_*.json
          git diff --cached --quiet && exit 0
          git commit -m "Horodatage de la chanson"
          for i in 1 2 3 4; do git pull --rebase origin transcription && git push origin HEAD:transcription && break; sleep $((i*3)); done
